# Ваши текущие системные настройки (оставляем для обратной совместимости)
android.useAndroidX=true
android.enableJetifier=true

# FIXED: Выделяем 2GB оперативной памяти для сборщика и Dexer'а (защита от OutOfMemoryError)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Оптимизация сборки в GitHub Actions
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Гасим системный варнинг о версии SDK 35
android.suppressUnsupportedCompileSdk=35
