name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Полное уничтожение любых фантомных манифестов в репозитории
      - name: Annihilate Duplicate Manifests
        run: |
          find . -name "AndroidManifest.xml" -exec rm -f {} +
          mkdir -p app/src/main

      # Запись кристально чистого официального маніфесту
      - name: Create Single Perfect Manifest
        run: |
          printf '%s\n' \
          '<?xml version="1.0" encoding="utf-8"?>' \
          '<manifest xmlns:android="http://android.com">' \
          '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' \
          '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />' \
          '    <application android:allowBackup="true" android:label="AudioPlayer" android:supportsRtl="true" android:theme="@android:style/Theme.Material.NoActionBar">' \
          '        <activity android:name="com.example.audioplayer.MainActivity" android:exported="true">' \
          '            <intent-filter>' \
          '                <action android:name="android.intent.action.MAIN" />' \
          '                <category android:name="android.intent.category.LAUNCHER" />' \
          '            </intent-filter>' \
          '        </activity>' \
          '        <service android:name="com.example.audioplayer.PlaybackService" android:foregroundServiceType="mediaPlayback" android:exported="false">' \
          '            <intent-filter>' \
          '                <action android:name="androidx.media3.session.MediaSessionService" />' \
          '            </intent-filter>' \
          '        </service>' \
          '    </application>' \
          '</manifest>' > app/src/main/AndroidManifest.xml

      # ИСПРАВЛЕНО: Правильное название шага для возвращения кнопки
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Assemble Debug APK
        run: gradle assembleDebug --no-daemon --no-build-cache

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioPlayer-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
