name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Просто налаштовуємо чисте середовище Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      # Запускаємо збірку з примусовим відключенням суворої валідації ресурсів
      - name: Assemble Debug APK
        run: gradle assembleDebug -Pandroid.aapt2.nowarn=true -Pandroid.experimental.manifestMerger.ignoreErrors=true

      # Зберігаємо готовий файл
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioPlayer-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
