name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Створюємо Gradle Wrapper 8.4 у системній папці /tmp, де немає жодних Android-файлів
      - name: Force Create Local Gradle Wrapper
        run: |
          mkdir /tmp/wrapper_generation
          cd /tmp/wrapper_generation
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          cd $GITHUB_WORKSPACE
          cp /tmp/wrapper_generation/gradlew .
          cp -r /tmp/wrapper_generation/gradle .
          chmod +x gradlew
          rm -rf /tmp/wrapper_generation

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioPlayer-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
