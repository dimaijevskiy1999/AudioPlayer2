name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Повне вичищення папок перед стартом
      - name: Deep Clean Workspace
        run: |
          rm -rf .gradle app/build buildsettings.gradle.kts build.gradle.kts settings.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml gradle.properties
          rm -rf .github/workflows/generate_project.yml

      - name: Force Fix Android Configuration
        run: |
          # 1. Створюємо settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AudioPlayer"
          include(":app")
          EOF

          # 2. Створюємо build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          EOF

          # 3. Налаштування властивостей
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=false
          org.gradle.caching=false
          EOF

          # 4. Створюємо внутрішній app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.example.audioplayer"
              compileSdk = 34
              defaultConfig { applicationId = "com.example.audioplayer"; minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "1.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.4" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2023.10.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
              implementation("androidx.media3:media3-exoplayer:1.3.1")
              implementation("androidx.media3:media3-session:1.3.1")
          }
          EOF

      # БЕЗПЕЧНЕ ЗАВАНТАЖЕННЯ ЧИСТОГО МАНІФЕСТУ БЕЗ ВНУТРІШНІХ КОНФЛІКТІВ GITHUB ACTIONS
      - name: Download Untouched Clean Manifest
        run: |
          mkdir -p app/src/main
          curl -sL "https://githubusercontent.com" -o app/src/main/AndroidManifest.xml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Assemble Debug APK
        run: gradle assembleDebug --no-daemon --no-build-cache
