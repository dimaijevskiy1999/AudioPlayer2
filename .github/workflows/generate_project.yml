name: Generate AudioPlayer Project
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Files using Python
        shell: python
        run: |
          import os
          import re

          with open("README.md", "r", encoding="utf-8") as f:
              text = f.read()

          # Находим все блоки заголовков и кодов
          pattern = r"###\s+`([^`]+)`\s*\n\s*```[a-zA-Z]*\n([\s\S]*?)\n```"
          matches = re.findall(pattern, text)

          for file_path, code in matches:
              file_path = file_path.strip()
              code = code.strip()
              
              # Проверяем, что путь не пустой и не содержит странных символов
              if not file_path or len(file_path) < 2:
                  continue
                  
              # Умное распределение путей для Android
              if file_path.endswith(".kt") and not file_path.startswith("app/"):
                  full_path = f"app/src/main/java/com/example/audioplayer/{file_path}"
              elif "AndroidManifest.xml" in file_path:
                  full_path = "app/src/main/AndroidManifest.xml"
              else:
                  full_path = file_path

              # Безопасное создание папок
              dir_name = os.path.dirname(full_path)
              if dir_name:
                  os.makedirs(dir_name, exist_ok=True)
              
              # Записываем файл
              try:
                  with open(full_path, "w", encoding="utf-8") as out_f:
                      out_f.write(code + "\n")
                  print(f"Успешно создан: {full_path}")
              except Exception as e:
                  print(f"Пропущен некорректный путь {full_path}: {e}")

          # Скачиваем официальный gradlew
          os.makedirs("gradle/wrapper", exist_ok=True)
          import urllib.request
          try:
              urllib.request.urlretrieve("https://githubusercontent.com", "gradlew")
          except Exception as e:
              print(f"Ошибка скачивания gradlew: {e}")
          
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          chmod +x gradlew || true
          git add .
          git commit -m "Автоматическая генерация структуры проекта" || exit 0
          git push origin main
