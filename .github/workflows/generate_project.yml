name: Generate AudioPlayer Project
on:
  workflow_dispatch: # Дозволяє запустити генерацію вручную кнопкой

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Files using Python
        shell: python
        run: |
          import os
          import re

          # Читаємо ваш README.md
          with open("README.md", "r", encoding="utf-8") as f:
              text = f.read()

          # Регулярний вираз для пошуку блоків: ### `шлях` і наступний блок коду ```...```
          pattern = r"###\s+`([^`]+)`\s*\n\s*```[a-zA-Z]*\n([\s\S]*?)\n```"
          matches = re.findall(pattern, text)

          for file_path, code in matches:
              file_path = file_path.strip()
              code = code.strip()
              
              # Розумне визначення куди покласти файл
              if file_path.endswith(".kt") and not file_path.startswith("app/"):
                  # Якщо це Kotlin файл без префікса, будуємо правильний Android-шлях
                  full_path = f"app/src/main/java/com/example/audioplayer/{file_path}"
              elif file_path == "AndroidManifest.xml":
                  full_path = "app/src/main/AndroidManifest.xml"
              else:
                  # Залишаємо як є для settings.gradle.kts, build.gradle.kts тощо
                  full_path = file_path

              # Створюємо потрібні папки
              os.makedirs(os.path.dirname(full_path), exist_ok=True)
              
              # Записуємо код у файл
              with open(full_path, "w", encoding="utf-8") as out_f:
                  out_f.write(code + "\n")
                  print(f"Створено файл: {full_path}")

          # Окремо завантажуємо офіційний gradlew, щоб він точно був правильним
          os.makedirs("gradle/wrapper", exist_ok=True)
          import urllib.request
          urllib.request.urlretrieve("https://githubusercontent.com", "gradlew")
          
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          chmod +x gradlew
          git add .
          git commit -m "Автоматична генерація структури проекту з README.md" || exit 0
          git push origin main
