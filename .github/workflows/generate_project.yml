name: Generate AudioPlayer Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Files using Python
        shell: python
        run: |
          import os
          import re
          import urllib.request

          with open("README.md", "r", encoding="utf-8") as f:
              text = f.read()

          pattern = r"###\s+`([^`]+)`\s*\n\s*```[a-zA-Z]*\n([\s\S]*?)\n```"
          matches = re.findall(pattern, text)

          for file_path, code in matches:
              file_path = file_path.strip()
              code = code.strip()
              
              if not file_path or len(file_path) < 2:
                  continue
              
              # ИГНОРИРУЕМ ФАЙЛ СБОРКИ (создадим его вручную для обхода защиты)
              if "build.yml" in file_path or "workflows" in file_path:
                  continue
                  
              if file_path.endswith(".kt") and not file_path.startswith("app/"):
                  full_path = f"app/src/main/java/com/example/audioplayer/{file_path}"
              elif "AndroidManifest.xml" in file_path:
                  full_path = "app/src/main/AndroidManifest.xml"
              else:
                  full_path = file_path

              dir_name = os.path.dirname(full_path)
              if dir_name:
                  os.makedirs(dir_name, exist_ok=True)
              with open(full_path, "w", encoding="utf-8") as out_f:
                  out_f.write(code + "\n")

          os.makedirs("gradle/wrapper", exist_ok=True)
          gradlew_url = "https://githubusercontent.com"
          try:
              with urllib.request.urlopen(gradlew_url) as response:
                  gradlew_code = response.read().decode('utf-8')
              with open("gradlew", "w", encoding="utf-8", newline='\n') as f:
                  f.write(gradlew_code)
          except Exception as e:
              print(f"Ошибка: {e}")

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          chmod +x gradlew || true
          git add .
          git commit -m "Автоматическая генерация структуры проекта" || exit 0
          git push origin main
