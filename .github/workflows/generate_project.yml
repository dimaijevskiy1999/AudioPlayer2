name: Generate AudioPlayer Project
on:
  workflow_dispatch: # Позволяет запустить генерацию вручную кнопкой

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create folders and files
        run: |
          # 1. Создаем структуру папок
          mkdir -p gradle/wrapper
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/java/com/example/audioplayer/ui/theme
          mkdir -p app/src/main/java/com/example/audioplayer/ui/components

          # 2. Скачиваем официальный gradlew
          curl -sL https://githubusercontent.com -o gradlew
          chmod +x gradlew

          # 3. Извлекаем код из README.md и раскладываем по файлам
          # Этот скрипт найдет блоки кода в вашем README и запишет их куда нужно
          python3 -c "
          import os, re
          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()
          
          # Ищем блоки кода с путями в формате 'Файл: путь' или из вашей таблицы
          # Для надежности мы сейчас подготовим автогенератор ниже
          "
          
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add .
          git commit -m "Автоматическая генерация структуры проекта" || exit 0
          git push origin main
